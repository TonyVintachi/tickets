// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.1.1' apply false // Use a recent stable version
    id 'com.android.library' version '8.1.1' apply false // Use a recent stable version
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // You can add other repositories here if needed
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
