plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 33 // Or the latest stable version
    defaultConfig {
        applicationId "com.sa.traffic.infringement"
        minSdkVersion 21
        targetSdkVersion 33 // Or the latest stable version
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.sa.traffic.infringement'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1' // Example androidx library
    implementation 'com.google.android.material:material:1.9.0' // Example Material Components
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Example ConstraintLayout
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
